<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benthic YOLO Detector & Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .container {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 25px;
      width: 420px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    input[type="file"] {
      margin: 10px 0;
      color: #f8fafc;
    }
    button {
      background-color: #38bdf8;
      border: none;
      padding: 10px 20px;
      color: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0ea5e9;
    }
    #output {
      margin-top: 20px;
      text-align: left;
      background-color: #0f172a;
      border-radius: 8px;
      padding: 15px;
      overflow-x: auto;
    }
    img.preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
    .loading {
      color: #38bdf8;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Benthic YOLO Detector + ConvNeXt Classifier</h1>
  <div class="container">
    <p>Upload an underwater image to detect and classify species:</p>
    <input type="file" id="imageInput" accept="image/*" />
    <img id="preview" class="preview" style="display:none;" />
    <button onclick="analyzeImage()">Analyze</button>
    <div id="output"></div>
  </div>

  <script>
    // Replace with your Render service URLs
    const YOLO_API = "https://benthic-yolo-api.onrender.com/detect";
    const CLASSIFY_API = "https://benthic-classifier-api.onrender.com/classify";

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const outputDiv = document.getElementById("output");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    async function analyzeImage() {
      const file = imageInput.files[0];
      if (!file) {
        outputDiv.innerHTML = "⚠️ Please upload an image first.";
        return;
      }

      const formData = new FormData();
      formData.append("image", file);
      outputDiv.innerHTML = `<p class="loading">🔍 Running detection and classification...</p>`;

      try {
        // Step 1 — YOLO detection
        const detectResponse = await fetch(YOLO_API, {
          method: "POST",
          body: formData
        });

        if (!detectResponse.ok) {
          throw new Error("YOLO API error: " + detectResponse.status);
        }

        const detectionData = await detectResponse.json();

        // Step 2 — ConvNeXt classification
        const classifyResponse = await fetch(CLASSIFY_API, {
          method: "POST",
          body: formData
        });

        if (!classifyResponse.ok) {
          throw new Error("Classifier API error: " + classifyResponse.status);
        }

        const classifyData = await classifyResponse.json();

        // Display results
        outputDiv.innerHTML = `
          <h3>✅ Results</h3>
          <p><b>Detected Objects:</b> ${detectionData.detections.length}</p>
          <p><b>Predicted Species:</b> ${classifyData.class}</p>
          <pre>${JSON.stringify(detectionData, null, 2)}</pre>
        `;

      } catch (err) {
        console.error(err);
        outputDiv.innerHTML = `<p style="color:#f87171;">❌ Error: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
