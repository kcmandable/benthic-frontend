<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benthic YOLO Detector</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      min-height: 100vh;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 20px;
    }
    .container {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    input[type="file"] {
      margin: 10px 0;
      width: 100%;
      padding: 6px;
    }
    button {
      background-color: #38bdf8;
      border: none;
      padding: 10px 20px;
      color: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
      width: 100%;
    }
    button:hover {
      background-color: #0ea5e9;
    }
    #output {
      margin-top: 20px;
      text-align: left;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
    .prediction {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .prediction strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Benthic YOLO Detector</h1>
  <div class="container">
    <p>Upload an underwater image to detect and classify species:</p>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="sendImage()">Analyze</button>
    <div id="output"></div>
  </div>

  <script>
    async function sendImage() {
      const fileInput = document.getElementById("imageInput");
      const outputDiv = document.getElementById("output");
      outputDiv.innerHTML = "⏳ Processing image...";

      const file = fileInput.files[0];
      if (!file) {
        outputDiv.innerHTML = "⚠️ Please upload an image first.";
        return;
      }

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("https://final-case-a-thon.onrender.com/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("API error: " + response.status);
        }

        const data = await response.json();

        let html = "";
        if (data.image_url) {
          html += `<img src="${data.image_url}" alt="Detected Image" />`;
        }

        if (data.detections && data.detections.length > 0) {
          html += `<h3>Detections:</h3>`;
          data.detections.forEach((det, idx) => {
            html += `
              <div class="prediction">
                <strong>Species ${idx + 1}:</strong> ${det.classifier_label}<br/>
                🧠 Classification Confidence: ${(det.classifier_confidence * 100).toFixed(2)}%<br/>
                🎯 Detection Confidence: ${(det.yolo_confidence * 100).toFixed(2)}%<br/>
                📦 BBox: [${det.bbox.join(", ")}]
              </div>
            `;
          });
        } else {
          html += `<p>❌ No detections found.</p>`;
        }

        outputDiv.innerHTML = html;
      } catch (err) {
        outputDiv.innerHTML = "❌ Error: " + err.message;
      }
    }
  </script>
</body>
</html>
