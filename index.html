<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benthic YOLO Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .container {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 25px;
      width: 420px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    input[type="file"] {
      margin: 10px 0;
      color: #f8fafc;
    }
    button {
      background-color: #38bdf8;
      border: none;
      padding: 10px 20px;
      color: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0ea5e9;
    }
    #output {
      margin-top: 20px;
      text-align: center;
    }
    img.preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
    .loading {
      color: #38bdf8;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Benthic YOLO Detector</h1>
  <div class="container">
    <p>Upload an underwater image to detect species:</p>
    <input type="file" id="imageInput" accept="image/*" />
    <img id="preview" class="preview" style="display:none;" />
    <button onclick="analyzeImage()">Analyze</button>
    <div id="output"></div>
  </div>

  <script>
    // 🔗 Replace this with your actual Render YOLO endpoint
    const YOLO_API = "https://two-final-case-a-thon.onrender.com";

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const outputDiv = document.getElementById("output");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    async function analyzeImage() {
      const file = imageInput.files[0];
      if (!file) {
        outputDiv.innerHTML = "⚠️ Please upload an image first.";
        return;
      }

      const formData = new FormData();
      formData.append("image", file);
      outputDiv.innerHTML = `<p class="loading">🔍 Running YOLO detection...</p>`;

      try {
        const response = await fetch(YOLO_API, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("YOLO API error: " + response.status);
        }

        const contentType = response.headers.get("content-type");
        if (contentType && contentType.includes("image")) {
          // If the API returns an annotated image
          const blob = await response.blob();
          const imgURL = URL.createObjectURL(blob);
          outputDiv.innerHTML = `<img src="${imgURL}" alt="Detection Output" />`;
        } else {
          // If the API returns JSON detections
          const data = await response.json();
          outputDiv.innerHTML = `
            <h3>✅ Detections</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (err) {
        console.error(err);
        outputDiv.innerHTML = `<p style="color:#f87171;">❌ Error: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
