<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benthic YOLO Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      color: #38bdf8;
    }
    .container {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    input[type="image"] {
      margin: 10px 0;
    }
    button {
      background-color: #38bdf8;
      border: none;
      padding: 10px 20px;
      color: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0ea5e9;
    }
    #output {
      margin-top: 20px;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Benthic YOLO Detector</h1>
  <div class="container">
    <p>Upload an underwater image to detect species:</p>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="sendImage()">Analyze</button>
    <div id="output"></div>
  </div>

  <script>
    async function sendImage() {
      const fileInput = document.getElementById("imageInput");
      const outputDiv = document.getElementById("output");
      outputDiv.innerHTML = "Processing...";

      const file = fileInput.files[0];
      if (!file) {
        outputDiv.innerHTML = "Please upload an image first.";
        return;
      }

      const formData = new FormData();
      formData.append("image", file); // ✅ CHANGED from "file" → "image"

      try {
        const response = await fetch("https://final-case-a-thon.onrender.com/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("API error: " + response.status);
        }

        const contentType = response.headers.get("content-type");
        if (contentType && contentType.includes("image")) {
          const blob = await response.blob();
          const imgURL = URL.createObjectURL(blob);
          outputDiv.innerHTML = `<img src="${imgURL}" alt="Predicted Output" />`;
        } else {
          const data = await response.json();
          outputDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

      } catch (err) {
        outputDiv.innerHTML = "❌ Error: " + err.message;
      }
    }
  </script>
</body>
</html>
